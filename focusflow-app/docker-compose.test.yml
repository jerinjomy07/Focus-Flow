services:
  postgres-test:
    image: postgres:16-alpine
    container_name: focusflow-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: focusflow_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d focusflow_test"]
      interval: 2s
      timeout: 2s
      retries: 10
