name: FocusFlow CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Quality Gates & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: focusflow-app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: focusflow-app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Type-Check
        run: npm run type-check

      - name: ESLint Static Analysis
        run: npm run lint

      - name: Automated Test Suite (Unit & Component)
        run: npm test

      - name: Production Build (Turbopack)
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/focusflow?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/focusflow?schema=public"
          AUTH_SECRET: "ci_pipeline_dummy_auth_secret_minimum_32_characters_for_build"
          AUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_APP_VERSION: "1.0.0"

      - name: Dependency Security Audit
        run: npm audit || true
